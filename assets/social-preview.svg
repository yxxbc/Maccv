<?xml version="1.0" encoding="UTF-8"?>
<!--
  GitHub social preview (1280×640).

  Composed as SVG rather than a raster editor so the mark, the palette and the
  type stay in one place and can be regenerated by a script.

  The tile is a single rounded rect with the clipboard drawn inside it, so no
  clipping is needed and the mark cannot pick up a square edge.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B12"/>
      <stop offset="1" stop-color="#161226"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C3DDB"/>
      <stop offset="0.55" stop-color="#6D4AE8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <!-- Radial glow that fades to nothing, so it never shows a hard edge. -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6D4AE8" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#6D4AE8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6D4AE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Glow behind the mark. Fades to transparent before the viewBox edge. -->
  <rect x="0" y="0" width="700" height="640" fill="url(#glow)"/>

  <!-- The mark. Tile occupies 96..552 in both axes (456 pt square, radius 103). -->
  <g transform="translate(96, 92)">
    <rect width="440" height="440" rx="99" fill="url(#tile)"/>

    <!-- Clipboard body, scaled to sit inside the tile with even margins. -->
    <g transform="translate(220, 220) scale(0.62) translate(-512, -512)">
      <rect x="312" y="272" width="400" height="512" rx="56" fill="#FFFFFF"/>
      <rect x="436" y="228" width="152" height="88" rx="34" fill="#FFFFFF"/>
      <rect x="462" y="248" width="100" height="48" rx="20" fill="#6D4AE8"/>
      <g fill="#6D4AE8">
        <rect x="376" y="404" width="272" height="40" rx="20"/>
        <rect x="376" y="492" width="208" height="40" rx="20" opacity="0.72"/>
        <rect x="376" y="580" width="140" height="40" rx="20" opacity="0.44"/>
      </g>
      <circle cx="704" cy="700" r="152" fill="#FFFFFF"/>
      <path d="M726 592 L626 736 L694 736 L666 826 L772 678 L702 678 Z" fill="#22D3EE"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="592" y="286" font-family="SF Pro Display, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="124" font-weight="700" fill="url(#title)" letter-spacing="-2">MacCV</text>

  <text x="596" y="350" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="400" fill="#A5B4FC">A fast, faithful macOS clipboard</text>

  <text x="596" y="406" font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="29" font-weight="400" fill="#8B8FA3">Rust engine · SwiftUI front end · zero-copy reads</text>

  <!-- Metrics. Three columns of 208 pt: the widest caption ("change detection",
       16 chars at 22 pt) measures ~165 pt, so nothing can collide. -->
  <g font-family="SF Pro Text, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="596" y="490" font-size="28" font-weight="600" fill="#22D3EE">0.5 µs</text>
    <text x="596" y="522" font-size="22" fill="#6B7280">change detection</text>

    <text x="804" y="490" font-size="28" font-weight="600" fill="#22D3EE">18</text>
    <text x="804" y="522" font-size="22" fill="#6B7280">pasteboard types</text>

    <text x="1012" y="490" font-size="28" font-weight="600" fill="#22D3EE">808 KB</text>
    <text x="1012" y="522" font-size="22" fill="#6B7280">release bundle</text>
  </g>
</svg>
