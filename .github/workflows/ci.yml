name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings rather than letting them accumulate.
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Rust engine: formatting, lints, tests, docs.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust engine
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Separate caches per job, since each builds different things.
          key: rust-engine

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        # These touch a real NSPasteboard via a process-private pasteboard, so they
        # need a logged-in session. They do not read or write the general clipboard.
        run: cargo test --workspace --all-targets

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # ---------------------------------------------------------------------------
  # The C ABI: the header must be current, and the smoke test must pass.
  # ---------------------------------------------------------------------------
  ffi:
    name: C ABI
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ffi

      - name: Build the static library
        run: cargo build --release -p maccv-ffi

      - name: Verify the committed header is up to date
        # cbindgen regenerates include/maccv.h during the build. If that changed the
        # file, the committed copy was stale — fail so it gets regenerated and
        # committed rather than silently drifting.
        run: |
          if ! git diff --exit-code -- crates/maccv-ffi/include/maccv.h; then
            echo "::error::crates/maccv-ffi/include/maccv.h is out of date. Run 'cargo build -p maccv-ffi' and commit the result."
            exit 1
          fi
          echo "Header is current."

      - name: Compile the C smoke test against the static library
        run: |
          clang -std=c11 -Wall -Wextra -Werror -O1 \
            -I crates/maccv-ffi/include \
            crates/maccv-ffi/tests/smoke.c \
            -o "$RUNNER_TEMP/maccv_smoke" \
            -L target/release -lmaccv_ffi \
            -framework AppKit -framework Foundation

      - name: Run the C smoke test
        run: '"$RUNNER_TEMP/maccv_smoke"'

  # ---------------------------------------------------------------------------
  # The SwiftUI app: builds in both configurations, and its engine handshake works.
  # ---------------------------------------------------------------------------
  app:
    name: MacCV app
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          # Needed for the packaging step below, so the DMG path is exercised on
          # every push rather than first on release day.
          pipx install dmgbuild
          python3 -m pip install --quiet --break-system-packages Pillow

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: app

      - name: Generate the Xcode project
        working-directory: apps/mac
        run: xcodegen generate

      - name: Build each architecture
        # Both shipping architectures, through the same script the release uses.
        # Previously this job built only the host architecture with a different
        # destination, so it validated a build shape that was never released.
        run: |
          set -euo pipefail
          for ARCH in arm64 x86_64; do
            Scripts/build-app.sh --arch "$ARCH" --out "dist/$ARCH"
          done

      - name: Run the app's self-test on each architecture
        # Proves Swift -> C ABI -> Rust works per slice, not just that it linked.
        run: |
          set -euo pipefail
          for ARCH in arm64 x86_64; do
            echo "=== $ARCH ==="
            "dist/$ARCH/MacCV.app/Contents/MacOS/MacCV" --self-test
          done

      - name: Package a DMG
        # The packaging path — background generation, dmgbuild, the icon layout,
        # mounting and verifying the image — used to run for the first time during
        # a release. Running it here means a broken DMG fails on a push.
        run: |
          set -euo pipefail
          PATH="$PATH:$HOME/.local/bin" \
            Scripts/make-dmg.sh \
              --app dist/arm64/MacCV.app \
              --out dist/MacCV-CI-arm64.dmg

      - name: Verify the DMG mounts and its app runs
        run: |
          set -euo pipefail
          MOUNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" dist/MacCV-CI-arm64.dmg >/dev/null
          APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::the image contains no app"; exit 1; }
          "$APP/Contents/MacOS/MacCV" --self-test
          hdiutil detach "$MOUNT" >/dev/null

      - name: Write the checksum the release would publish
        # Exercises the same checksum path, so a release cannot fail on it.
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 ./*.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Summarise
        run: |
          {
            echo "### Build"
            for ARCH in arm64 x86_64; do
              APP="dist/$ARCH/MacCV.app"
              echo "- \`$ARCH\`: $(du -sh "$APP" | cut -f1), $(lipo -info "$APP/Contents/MacOS/MacCV" | grep -o 'architecture: .*')"
            done
            echo "- DMG: $(du -sh dist/*.dmg | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the DMG for inspection
        # Makes a failure diagnosable without re-running the job.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MacCV-CI-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn
