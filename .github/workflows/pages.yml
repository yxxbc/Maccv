name: Website

# Publishes the bilingual site in docs/ to GitHub Pages, and keeps the update feed
# (docs/latest.json) in step with the newest release.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Called by the release workflow so latest.json is refreshed as part of a release.
  workflow_call:
    # No inputs: the feed is derived from the newest published release, so a caller only
    # has to say "deploy".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but do let a queued one proceed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive the update feed from the newest release
        # Every deploy, not just releases. The feed lives in `docs/` to be served, and
        # `docs/` is what Pages uploads — so a feed written once during a release was
        # deleted by the next push to main, and installed copies began reporting a failed
        # update check against the 404 page.
        #
        # Deriving it from the release's own assets on every deploy cannot drift: there is
        # no stored copy that can describe a release which was never published.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/checks/publish_feed.py

      - name: Show the feed that will be published
        run: |
          set -euo pipefail
          cat docs/latest.json 2>/dev/null || true
          cat docs/preview.json 2>/dev/null || true

      - name: Verify the site's internal links resolve
        # A broken link in a docs-only deploy is otherwise only noticed by a visitor.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          docs = pathlib.Path("docs")
          failures = []

          for page in docs.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              base = page.parent
              for href in re.findall(r'(?:href|src)="([^"]+)"', text):
                  if href.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = (base / href.split("#")[0]).resolve()
                  if href.split("#")[0] == "":
                      continue
                  if not target.exists():
                      failures.append(f"{page.relative_to(docs)}: {href} -> missing")
                  if target.is_dir() and not (target / "index.html").exists():
                      failures.append(f"{page.relative_to(docs)}: {href} -> no index.html")

          if failures:
              print("broken links:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print(f"checked {len(list(docs.rglob('*.html')))} pages: no broken internal links")
          PY

      - name: Verify both languages cover the same sections
        # The usual failure mode of a bilingual site is one language quietly going
        # stale, so compare structure rather than trusting the author.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def structure(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              return {
                  "sections": re.findall(r'<section id="([^"]+)"', text),
                  "anchors": sorted(set(re.findall(r'href="#([^"]+)"', text))),
                  "tables": text.count("<table"),
                  "steps": text.count("<li>"),
              }

          en = structure("docs/index.html")
          zh = structure("docs/zh/index.html")

          problems = [k for k in en if en[k] != zh[k]]
          if problems:
              for k in problems:
                  print(f"MISMATCH {k}:\n  en={en[k]}\n  zh={zh[k]}")
              sys.exit(1)
          print("en and zh pages are structurally identical")
          PY

      - name: Confirm Pages is enabled
        # This action cannot enable Pages itself; it fails with "Get Pages site
        # failed" when the repository has never had it switched on. Making that
        # explicit turns an opaque API error into an instruction.
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "Enable it once, choosing 'GitHub Actions' as the source:"
            echo "  gh api --method POST repos/${{ github.repository }}/pages -f build_type=workflow"
            echo "or in the web UI: Settings → Pages → Build and deployment → Source: GitHub Actions"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
