name: Website

# Publishes the bilingual site in docs/ to GitHub Pages, and keeps the update feed
# (docs/latest.json) in step with the newest release.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Called by the release workflow so latest.json is refreshed as part of a release.
  workflow_call:
    inputs:
      version:
        description: "Version to publish into the feed"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
      channel:
        description: "stable or preview — decides which feed is written"
        required: true
        type: string
      x86_64_url:
        description: "Intel DMG URL"
        required: true
        type: string
      x86_64_sha:
        description: "Intel DMG SHA-256"
        required: true
        type: string
      x86_64_size:
        description: "Intel DMG size in bytes"
        required: true
        type: string
      arm64_url:
        description: "Apple silicon DMG URL"
        required: true
        type: string
      arm64_sha:
        description: "Apple silicon DMG SHA-256"
        required: true
        type: string
      arm64_size:
        description: "Apple silicon DMG size in bytes"
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but do let a queued one proceed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write the update feed
        # One feed per channel. A preview build must never reach ordinary users, and
        # the only way to guarantee that is for it to land in a different document
        # rather than behind a flag someone could get wrong.
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          X86_URL: ${{ inputs.x86_64_url }}
          X86_SHA: ${{ inputs.x86_64_sha }}
          X86_SIZE: ${{ inputs.x86_64_size }}
          ARM_URL: ${{ inputs.arm64_url }}
          ARM_SHA: ${{ inputs.arm64_sha }}
          ARM_SIZE: ${{ inputs.arm64_size }}
        run: python3 Scripts/checks/write_feed.py

      - name: Show the feed that will be published
        if: ${{ inputs.version != '' }}
        run: |
          set -euo pipefail
          cat docs/latest.json 2>/dev/null || true
          cat docs/preview.json 2>/dev/null || true

      - name: Verify the site's internal links resolve
        # A broken link in a docs-only deploy is otherwise only noticed by a visitor.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          docs = pathlib.Path("docs")
          failures = []

          for page in docs.rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              base = page.parent
              for href in re.findall(r'(?:href|src)="([^"]+)"', text):
                  if href.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  target = (base / href.split("#")[0]).resolve()
                  if href.split("#")[0] == "":
                      continue
                  if not target.exists():
                      failures.append(f"{page.relative_to(docs)}: {href} -> missing")
                  if target.is_dir() and not (target / "index.html").exists():
                      failures.append(f"{page.relative_to(docs)}: {href} -> no index.html")

          if failures:
              print("broken links:")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print(f"checked {len(list(docs.rglob('*.html')))} pages: no broken internal links")
          PY

      - name: Verify both languages cover the same sections
        # The usual failure mode of a bilingual site is one language quietly going
        # stale, so compare structure rather than trusting the author.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys

          def structure(path):
              text = pathlib.Path(path).read_text(encoding="utf-8")
              return {
                  "sections": re.findall(r'<section id="([^"]+)"', text),
                  "anchors": sorted(set(re.findall(r'href="#([^"]+)"', text))),
                  "tables": text.count("<table"),
                  "steps": text.count("<li>"),
              }

          en = structure("docs/index.html")
          zh = structure("docs/zh/index.html")

          problems = [k for k in en if en[k] != zh[k]]
          if problems:
              for k in problems:
                  print(f"MISMATCH {k}:\n  en={en[k]}\n  zh={zh[k]}")
              sys.exit(1)
          print("en and zh pages are structurally identical")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
