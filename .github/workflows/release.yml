name: Release

# Publishes a release from a tag.
#
# Two things this workflow is careful about:
#
# 1. It never publishes from a branch. A tag is the only trigger, so what is
#    released is exactly what was tagged and verified.
# 2. It refuses to publish a stable release for a version that still looks like a
#    preview (a hyphenated pre-release), because the stable feed is what every
#    ordinary user reads.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish release
    runs-on: xcode-27
    env:
      # `secrets` cannot be referenced from a step's `if:`, so it is lifted to the job
      # level where it can be tested. Empty means signing is not configured.
      HAS_SIGNING: ${{ secrets.MACCV_DEVELOPER_ID != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
      x86_64_url: ${{ steps.package.outputs.x86_64_url }}
      x86_64_sha: ${{ steps.package.outputs.x86_64_sha }}
      x86_64_size: ${{ steps.package.outputs.x86_64_size }}
      arm64_url: ${{ steps.package.outputs.arm64_url }}
      arm64_sha: ${{ steps.package.outputs.arm64_sha }}
      arm64_size: ${{ steps.package.outputs.arm64_size }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version and channel
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"

          # A hyphen means a pre-release, which goes to the preview feed and is
          # marked as such on GitHub. This is what keeps a test build away from
          # ordinary users.
          if [[ "$VERSION" == *-* ]]; then
            CHANNEL="preview"
          else
            CHANNEL="stable"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG as a $CHANNEL build"

      - name: Fail early if the changelog has nothing for this version
        # A release with no notes is a release nobody can read. Stop before the
        # build so the fix is a changelog edit, not a re-run.
        run: ./Scripts/changelog-notes.sh --check "${{ steps.version.outputs.version }}"

      - name: Confirm the manifests carry the released version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 Scripts/checks/version_consistency.py
          MANIFEST=$(python3 Scripts/checks/print_version.py)
          if [[ "$MANIFEST" != "$VERSION" ]]; then
            echo "::error::Cargo.toml says $MANIFEST but the tag says $VERSION. Run Scripts/bump-version.sh and re-tag."
            exit 1
          fi
          echo "Manifests match the tag ($MANIFEST)."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both slices are needed for the separate per-architecture packages.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen
          # dmgbuild writes the .DS_Store itself instead of driving Finder over
          # AppleEvents, so it does not time out on a headless runner.
          pipx install dmgbuild
          python3 -m pip install --quiet --break-system-packages Pillow

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Test the engine
        run: cargo test --workspace

      - name: Import the Developer ID certificate
        # Optional. Absent, the release is ad-hoc signed and macOS warns on first
        # launch — which is why the README says to expect that. Present, the release
        # is signed and notarized and the warning disappears.
        id: signing
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          CERTIFICATE: ${{ secrets.MACCV_DEVELOPER_ID }}
          PASSWORD: ${{ secrets.MACCV_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/maccv-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046  # deliberate word splitting of the chain list
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "Signed builds enabled."

      - name: Generate the Xcode project
        working-directory: apps/mac
        run: xcodegen generate

      # -----------------------------------------------------------------------
      # Build each architecture as its own app, then package each as its own DMG.
      #
      # Per-architecture rather than one universal DMG: a universal image is about
      # twice the size for every user, and the extra slice is dead weight on both
      # kinds of Mac. The feed tells each machine which one to fetch.
      # -----------------------------------------------------------------------
      - name: Build and package each architecture
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          NOTARY_KEY: ${{ secrets.MACCV_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACCV_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACCV_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          mkdir -p dist

          for ARCH in arm64 x86_64; do
            echo "=== $ARCH ==="

            # The same script CI runs, so the artifacts released are produced by
            # code that has already been exercised on every push.
            Scripts/build-app.sh --arch "$ARCH" --out "dist/$ARCH"

            # Sign before packaging, so the signature covers what ships inside the
            # image. Ad-hoc when no certificate is configured.
            if [[ -n "${{ steps.signing.outputs.keychain }}" ]]; then
              codesign --force --deep --options runtime --timestamp \
                --sign "Developer ID Application" "dist/$ARCH/MacCV.app"
              codesign --verify --deep --strict --verbose=2 "dist/$ARCH/MacCV.app"
            fi

            DMG="dist/MacCV-$VERSION-$ARCH.dmg"
            PATH="$PATH:$HOME/.local/bin" \
              Scripts/make-dmg.sh --app "dist/$ARCH/MacCV.app" --out "$DMG"

            if [[ -n "${{ steps.signing.outputs.keychain }}" ]]; then
              codesign --force --timestamp --sign "Developer ID Application" "$DMG"
            fi
          done

          # ---------------------------------------------------------------------
          # Notarization. Submitting the DMG covers the app inside it.
          #
          # The staple step is what removes the first-launch prompt entirely: without
          # a stapled ticket macOS has to ask Apple over the network, and offline it
          # warns instead.
          # ---------------------------------------------------------------------
          if [[ -n "${{ steps.signing.outputs.keychain }}" ]]; then
            echo "=== notarizing ==="
            printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"

            for image in dist/*.dmg; do
              xcrun notarytool submit "$image" \
                --key "$RUNNER_TEMP/notary.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER" \
                --wait
              xcrun stapler staple "$image"
              xcrun stapler validate "$image"
            done

            rm -f "$RUNNER_TEMP/notary.p8"
            security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          else
            echo "::warning::Publishing ad-hoc signed. macOS will warn on first launch;"
            echo "::warning::set MACCV_DEVELOPER_ID and the notary secrets to remove it."
          fi

          # ---------------------------------------------------------------------
          # Checksums: one combined file, plus a per-file copy.
          #
          # Both spellings because the audiences differ: `SHA256SUMS` is what a
          # person or `shasum -c` expects, and the `.sha256` sidecar sits beside its
          # artifact for anyone who grabbed a single file.
          # ---------------------------------------------------------------------
          cd dist
          shasum -a 256 ./*.dmg > SHA256SUMS
          for image in ./*.dmg; do
            shasum -a 256 "$image" | awk '{print $1}' > "$image.sha256"
          done

          echo "=== checksums ==="
          cat SHA256SUMS

          # Publish the values the site feed and the release body need.
          for ARCH in arm64 x86_64; do
            IMAGE="MacCV-$VERSION-$ARCH.dmg"
            SHA=$(awk "/$IMAGE/{print \$1}" SHA256SUMS)
            SIZE=$(stat -f%z "$IMAGE")
            {
              echo "${ARCH}_url=https://github.com/$REPO/releases/download/$TAG/$IMAGE"
              echo "${ARCH}_sha=$SHA"
              echo "${ARCH}_size=$SIZE"
            } >> "$GITHUB_OUTPUT"
            echo "$IMAGE  $SHA  ($SIZE bytes)"
          done

      - name: Generate the release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          X86_URL: ${{ steps.package.outputs.x86_64_url }}
          X86_SHA: ${{ steps.package.outputs.x86_64_sha }}
          ARM_URL: ${{ steps.package.outputs.arm64_url }}
          ARM_SHA: ${{ steps.package.outputs.arm64_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Choose your download"
            echo
            echo "| Your Mac | Download | SHA-256 |"
            echo "|---|---|---|"
            echo "| Apple silicon (M-series) | [MacCV-$VERSION-arm64.dmg]($ARM_URL) | \`$ARM_SHA\` |"
            echo "| Intel | [MacCV-$VERSION-x86_64.dmg]($X86_URL) | \`$X86_SHA\` |"
            echo
            echo "Not sure which?  → About This Mac. Apple silicon says \"Chip: Apple M…\";"
            echo "anything that says \"Processor: Intel\" wants the Intel build."
            echo
            echo "**Install:** open the DMG and drag **MacCV** onto **Applications**."
            echo "The disk image is signed and its contents verified before packaging;"
            echo "macOS still asks for confirmation the first time because it is not yet"
            echo "notarized."
            echo
            echo "Every file's checksum is in \`SHA256SUMS\` on this release."
            echo
            echo "---"
            echo
            ./Scripts/changelog-notes.sh "$VERSION"
          } > RELEASE_NOTES.md
          head -30 RELEASE_NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MacCV ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/*.sha256
          draft: false
          prerelease: ${{ steps.version.outputs.channel == 'preview' }}
          fail_on_unmatched_files: true

  # Refresh the website's feeds so installed copies see this release. A separate
  # job because it needs Pages permissions the release job must not have.
  website:
    name: Update the site's release feed
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      version: ${{ needs.release.outputs.version }}
      tag: ${{ needs.release.outputs.tag }}
      channel: ${{ needs.release.outputs.channel }}
      x86_64_url: ${{ needs.release.outputs.x86_64_url }}
      x86_64_sha: ${{ needs.release.outputs.x86_64_sha }}
      x86_64_size: ${{ needs.release.outputs.x86_64_size }}
      arm64_url: ${{ needs.release.outputs.arm64_url }}
      arm64_sha: ${{ needs.release.outputs.arm64_sha }}
      arm64_size: ${{ needs.release.outputs.arm64_size }}
