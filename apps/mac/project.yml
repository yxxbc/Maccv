name: MacCV
options:
  bundleIdPrefix: io.github.yxxbc
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    # The engine is a static library; no dynamic library search paths are needed.
    DEAD_CODE_STRIPPING: YES
    # Reproducible-ish builds: never embed the build path in the binary.
    GCC_PREFIX_HEADER: ""
    # The Xcode project lives in apps/mac; everything shared is two levels up.
    MACCV_ROOT: $(SRCROOT)/../..
  # Both architectures are always built for release; a Debug build only builds the
  # host's, because cross-compiling the Rust engine for the other slice on every
  # iteration would dominate build time for no benefit.
  configs:
    Debug:
      MACCV_PROFILE: debug
      # Host architecture only: cross-compiling the engine on every Debug build
      # would dominate iteration time for no benefit.
      MACCV_ARCH: native
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      # Rust is the expensive part; keep its artifacts out of Xcode's cleaning.
      CARGO_TARGET_DIR: $(MACCV_ROOT)/target
    Release:
      MACCV_PROFILE: release
      # Both slices of the Rust static library, lipo'd into one archive.
      MACCV_ARCH: universal
      # Stated explicitly: the destination can narrow ARCHS to the host, which
      # would quietly ship an Apple-silicon-only build.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      CARGO_TARGET_DIR: $(MACCV_ROOT)/target

targets:
  MacCV:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacCV
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: MacCV
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yxxbc.maccv

        # --- Info.plist -------------------------------------------------------
        #
        # A committed plist, not xcodegen's `info:` shorthand. The shorthand
        # *replaces* the target's plist configuration rather than merging with it,
        # which silently discarded INFOPLIST_FILE and every key declared here. That
        # is how the first release shipped without an app icon — CFBundleIconFile
        # was among the keys that vanished, and nothing failed. The app simply had
        # the generic blank icon.
        #
        # Version values use $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION)
        # substitution, so Scripts/bump-version.sh still updates one place.
        INFOPLIST_FILE: MacCV-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # --- end Info.plist ---------------------------------------------------

        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "20261011"
        # Link the Rust engine and the frameworks AppKit needs from Rust.
        LIBRARY_SEARCH_PATHS:
          - $(MACCV_ROOT)/target/maccv-apple
          - $(MACCV_ROOT)/target
        OTHER_LDFLAGS:
          - -lmaccv_ffi
          - -framework
          - AppKit
          - -framework
          - Foundation
          - -framework
          - CoreFoundation
          - -lc++
        HEADER_SEARCH_PATHS:
          - $(MACCV_ROOT)/crates/maccv-ffi/include
          - $(MACCV_ROOT)/target/maccv-apple/include
        # Nothing here should be sandboxed away from the pasteboard.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # The build phase below runs cargo; it must not race Swift compilation.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/MacCV/MacCV-Bridging-Header.h
    preBuildScripts:
      - name: Build Rust clipboard engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          "$MACCV_ROOT/Scripts/build-rust.sh" --profile "$MACCV_PROFILE" --arch "$MACCV_ARCH"
        outputFiles:
          - $(MACCV_ROOT)/target/maccv-apple/libmaccv_ffi.a
