[package]
name = "maccv-ffi"
description = "C ABI bridge exposing maccv-core to native app front ends (Swift, ObjC, C)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = false

[lib]
name = "maccv_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
maccv-core = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["std", "NSString", "NSData", "NSArray"] }
objc2-app-kit = { workspace = true, features = ["NSPasteboard", "NSPasteboardItem"] }
libc = "0.2"

[build-dependencies]
cbindgen = "0.29"
