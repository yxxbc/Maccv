# cbindgen configuration for the MacCV C ABI.
#
# Rust type names already carry the `Maccv` prefix, so no automatic prefixing is
# applied — that would yield `MaccvMaccvError`.

language = "C"
include_guard = "MACCV_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
line_length = 100

header = """/*
 * MacCV clipboard engine — C ABI.
 *
 * Generated by cbindgen from crates/maccv-ffi. Do not edit by hand;
 * regenerate with `cargo build -p maccv-ffi`.
 *
 * Memory rules
 * ------------
 *   - `MaccvSnapshot` is owned by the caller: release it with `maccv_snapshot_free`
 *     and nothing else. It owns every string and byte buffer it contains.
 *   - `MaccvPasteboard` is owned: release with `maccv_pasteboard_free`.
 *   - `MaccvWatch` is owned: release with `maccv_watch_stop`, which joins the
 *     watcher thread before returning.
 *   - Strings from `maccv_pasteboard_name` and `maccv_last_error_message` are
 *     owned: release with `maccv_string_free`.
 *   - Strings from `maccv_version` and `maccv_error_message` are static: never free.
 *   - `MaccvString` / `MaccvData` carry an explicit length, so payloads may
 *     contain NUL bytes and callers never need `strlen` or `strnlen`.
 */"""

after_includes = """
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>

/*
 * Opaque handles. The Rust side owns their layout; C only ever passes the
 * pointer around. Declared here because cbindgen cannot describe a Rust type
 * that has no C representation, and generating the struct body would emit
 * Rust-only field types.
 */
typedef struct MaccvPasteboard MaccvPasteboard;
typedef struct MaccvWatch MaccvWatch;
"""

[export]
item_types = ["enums", "structs", "functions", "typedefs"]
# Emitted by hand above instead, so their Rust-only fields never leak into C.
exclude = ["MaccvPasteboard", "MaccvWatch"]

[fn]
args = "horizontal"

[enum]
prefix_with_name = false
rename_variants = "qualified_screaming_snake_case"

[parse]
parse_deps = false
